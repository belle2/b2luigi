stages:
  - pre_commit
  - test
  - docs
  - publish

variables:
  ARTIFACTS_TEST_PATH: "junit/test-results.xml"
  ARTIFACTS_DOCS_PATH: "docs-build"
  ARTIFACTS_COV_PATH: "coverage/"
  PYTHON_VERSION: "3.12"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_PIPELINE_SOURCE == 'push' && ($CI_COMMIT_BRANCH == 'main') && $CI_COMMIT_TITLE =~ /Merge branch.*/
    - if: $CI_COMMIT_TAG
    - if: $GITLAB_FORCE_RUNNING_PIPELINE == 'yes'

default:
  image: python:${PYTHON_VERSION}
  tags:
    - gitlab-runner12
  before_script:
    - pip install "uv~=0.12.18"
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache
  interruptible: true  # All the jobs can be interrupted by newer pipelines

pre_commit:
  stage: pre_commit
  script:
    - uvx pre-commit run --all-files

test:
  stage: test
  script:
    - uv sync --locked --group test
    - echo "Running tests"
    - uv run pytest -v --cov b2luigi --junitxml=$ARTIFACTS_TEST_PATH --cov-report=xml --cov-report=html --cov-report=term tests
    - mv htmlcov $ARTIFACTS_COV_PATH
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.11", "3.12"]
  artifacts:
    reports:
      junit: $ARTIFACTS_TEST_PATH
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - junit/test-results.xml
      - coverage/
    expose_as: 'test result and coverage'

test-tui:
  stage: test
  script:
    - uv sync --locked --group test --extra tui
    - uv run pytest -v --junitxml=$ARTIFACTS_TEST_PATH tests/cli/test_tui.py
  artifacts:
    reports:
      junit: $ARTIFACTS_TEST_PATH
    paths:
      - junit/test-results.xml
    expose_as: 'TUI test results'

docs:
  stage: docs
  needs:
    - job: test
      artifacts: false
  script:
    - uv sync --locked --group docs
    - uv run sphinx-build docs/ $ARTIFACTS_DOCS_PATH
  artifacts:
    paths:
      - docs-build/
    expire_in: 1 week
    expose_as: 'sphinx documentation'
    when: on_success

publish:
  stage: publish
  needs:
    - job: test
      artifacts: false
    - job: docs
      artifacts: false
  variables:
    UV_PUBLISH_TOKEN: $FLIT_PASSWORD
  script:
    - uv build
    - uv publish
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+$/'

publish_testpypi:
  stage: publish
  needs:
    - job: test
      artifacts: false
    - job: docs
      artifacts: false
  variables:
    UV_PUBLISH_TOKEN: $TESTPYPI_TOKEN
  script:
    - uv build
    - uv publish --index testpypi
  when: manual

prepare_release:
  stage: publish
  rules:
  - if: '$CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+$/'
  script:
    - 'curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/changelog?version=$CI_COMMIT_TAG" | python3 -c "import json, sys; print(json.load(sys.stdin)[\"notes\"])" > release_notes.md'
  artifacts:
    paths:
    - release_notes.md

publish_release:
  stage: publish
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  before_script: []
  needs:
    - job: prepare_release
      artifacts: true
  rules:
  - if: '$CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+$/'
  script:
    - echo "Creating release"
  release:
    name: 'Release $CI_COMMIT_TAG'
    description: release_notes.md
    tag_name: '$CI_COMMIT_TAG'
    ref: '$CI_COMMIT_SHA'
